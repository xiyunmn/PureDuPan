name: Build CI / Release
run-name: ${{ github.event_name == 'push' && 'CI' || 'Release' }} · ${{ github.ref_name }} · build ${{ github.run_number }}

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ github.event_name == 'push' && 'CI' || 'Release' }} APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Keep both channels in this workflow: run_number is scoped to a workflow.
      # A rerun retains its code; each new push or manual run gets a higher code.
      - name: Set build version
        env:
          BUILD_SEQUENCE: ${{ github.run_number }}
          BUILD_EVENT: ${{ github.event_name }}
        run: |
          echo "ORG_GRADLE_PROJECT_MODULE_VERSION_CODE=$((100000 + BUILD_SEQUENCE))" >> "$GITHUB_ENV"
          if [ "$BUILD_EVENT" = push ]; then
            count=$(git rev-list --count HEAD)
            commit=$(git rev-parse --short=7 HEAD)
            echo "ORG_GRADLE_PROJECT_CI_VERSION_NAME=r${count}.${commit}" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/puredupan-key.jks"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build signed APK
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: ${{ runner.temp }}/puredupan-key.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Remove signing keystore
        if: always()
        run: rm -f -- "$RUNNER_TEMP/puredupan-key.jks"

      - name: Read APK output
        id: artifact
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          apk_dir = Path('app/build/outputs/apk/release')
          metadata = json.loads((apk_dir / 'output-metadata.json').read_text())
          output, = metadata['elements']
          apk = apk_dir / output['outputFile']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'apk={apk}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write(f"APK: `{apk.name}`\n\nVersion: `{output['versionName']}` / `{output['versionCode']}`\n")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.artifact.outputs.apk }}
          archive: false
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 90 }}
